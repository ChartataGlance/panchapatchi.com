<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Patchi</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <nav class="top-nav"><a href="index.html">Static Patchi</a></nav>
  <div id="selected-top" class="selected-bar">Selected: Loading...</div>

  <main class="wrap">
    <section class="tabs">
      <div class="tab-buttons">
        <button class="tab-button" data-paksha="shukla">Shukla</button>
        <button class="tab-button" data-paksha="krishna">Krishna</button>
      </div>
      <div id="tithi-progress" class="tithi-progress"></div>
      <div id="weekday-tabs" class="weekday-tabs"></div>
      <div class="daynight-tabs">
        <button class="daynight-button" data-daynight="day"><span class="daynight-label">Day</span><small class="authority-line"></small><em><b></b><b></b><b></b><b></b><b></b></em></button>
        <button class="daynight-button" data-daynight="night"><span class="daynight-label">Night</span><small class="authority-line"></small><em><b></b><b></b><b></b><b></b><b></b></em></button>
      </div>
      <div id="samam-progress" class="samam-progress"></div>
      <div id="act-progress" class="act-progress"></div>
      <div id="act-bubble-progress" class="act-bubble-progress"></div>
      <div id="predict-card" class="predict-card"></div>
      <div id="relation-card" class="relation-card"></div>
      <div id="astro-note" class="muted note"></div>
    </section>
  </main>

  <form class="card lookup-panel" id="lookup-form">
    <button type="button" id="lookup-toggle" class="lookup-toggle">Lookup</button>
    <div id="lookup-fields">
      <div class="lookup-grid">
        <label>Place/Town <input type="text" name="place" autocomplete="off" placeholder="manual name"></label>
        <label>Lat <input type="number" name="lat" step="0.000001" value="13.0827" required></label>
        <label>Lon <input type="number" name="lon" step="0.000001" value="80.2707" required></label>
        <label>Date <input type="date" name="date" required></label>
        <label>Time <input type="time" name="time" required></label>
        <button type="button" id="geo-btn">Here</button>
        <button type="button" id="lookup-reset">Reset</button>
      </div>
    </div>
  </form>
</body>
</html>
