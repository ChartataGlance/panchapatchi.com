<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Panchapatchi Tree v011</title>
  <link rel="stylesheet" href="assets/css/style.css?v=011" />
</head>
<body>
  <main class="app-shell">
    <section class="top-card">
      <div>
        <p class="eyebrow">Panchapatchi Live</p>
        <h1>Current Bird & Activity</h1>
      </div>
      <button id="locateBtn" class="btn">Use My Location</button>
    </section>

    <section class="moon-card">
      <div class="moon-orbit" id="moonOrbit" aria-label="30 moon blocks"></div>
      <div class="moon-info">
        <strong id="moonLabel">Moon loading…</strong>
        <span id="moonMeta">30 blocks · 12° each</span>
      </div>
    </section>

    <section id="currentCard" class="current-card">
      <div class="patchi-big" id="currentIcon">🐓</div>
      <div>
        <p class="eyebrow" id="currentPath">Moon → Day → Part → Sub → Activity</p>
        <h2 id="currentTitle">Calculating current activity…</h2>
        <p id="currentTime">Allow location or use fallback times.</p>
      </div>
    </section>

    <section class="tree-wrap">
      <div class="section-head">
        <h2>Full Panchapatchi Tree</h2>
        <p>Moon → Weekday → Day/Night → Part → Sub → Activity</p>
      </div>
      <div id="tree" class="tree"></div>
    </section>
  </main>
  <script src="assets/js/app.js?v=011"></script>
</body>
</html>
