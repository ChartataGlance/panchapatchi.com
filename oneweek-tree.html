<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>One Week Panchapatchi Tree</title>
  <link rel="stylesheet" href="assets/css/style.css?v=007">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">பஞ்ச பட்சி</a>
  <nav><a href="oneweek-tree.html">One Week Tree</a></nav>
</header>
<main class="wrap">
  <section class="controls card">
    <h1>One Week Tree Model</h1>
    <p class="muted">Model from moon phase to day/night, then divided into 5 parts and each part into 5 sub-parts.</p>
    <div class="grid controls-grid">
      <label>Moon Phase
        <select id="moonPhase">
          <option value="waxing">வளர் பிறை / Waxing 0° → 180°</option>
          <option value="waning">தேய் பிறை / Waning 180° → 360°</option>
        </select>
      </label>
      <label>Weekday
        <select id="weekday"></select>
      </label>
      <label>Period
        <select id="period">
          <option value="day">பகல் / Day</option>
          <option value="night">இரவு / Night</option>
        </select>
      </label>
      <label>Sunrise
        <input id="sunrise" type="time" step="1" value="06:00:00">
      </label>
      <label>Sunset
        <input id="sunset" type="time" step="1" value="18:00:00">
      </label>
      <label>Next Sunrise
        <input id="nextSunrise" type="time" step="1" value="06:00:00">
      </label>
    </div>
    <button id="buildBtn" class="btn">Build Time Tree</button>
  </section>

  <section class="summary card" id="summary"></section>
  <section class="tree" id="tree"></section>
</main>
<script src="assets/js/tree.js?v=007"></script>
</body>
</html>
